<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل طالبة متأخرة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="late-container">

    <div class="form-card">

        <h1>📝 تسجيل طالبة متأخرة</h1>

        <p class="subtitle">
            أدخلي بيانات الطالبة
        </p>

        <form id="lateForm">

            <label for="className">
                الصف
            </label>

            <select id="className" required>

                <option value="">
                    اختاري الصف
                </option>

                <option value="سابع أ">سابع أ</option>
                <option value="سابع ب">سابع ب</option>
                <option value="سابع ج">سابع ج</option>

                <option value="ثامن أ">ثامن أ</option>
                <option value="ثامن ب">ثامن ب</option>
                <option value="ثامن ج">ثامن ج</option>

                <option value="تاسع أ">تاسع أ</option>
                <option value="تاسع ب">تاسع ب</option>
                <option value="تاسع ج">تاسع ج</option>

                <option value="عاشر أ">عاشر أ</option>
                <option value="عاشر ب">عاشر ب</option>

                <option value="أول ثانوي أ">أول ثانوي أ</option>
                <option value="أول ثانوي ب">أول ثانوي ب</option>

                <option value="توجيهي صحي">توجيهي صحي</option>
                <option value="توجيهي هندسي">توجيهي هندسي</option>
                <option value="توجيهي لغات">توجيهي لغات</option>
                <option value="توجيهي أعمال">توجيهي أعمال</option>

                <option value="عاشر IT">عاشر IT</option>
                <option value="أول ثانوي IT">أول ثانوي IT</option>
                <option value="توجيهي IT">توجيهي IT</option>

                <option value="عاشر أعمال">عاشر أعمال</option>
                <option value="أول ثانوي أعمال">أول ثانوي أعمال</option>

                <option value="توجيهي BTEC أعمال">
                    توجيهي BTEC أعمال
                </option>

            </select>


            <label for="studentName">
                اسم الطالبة
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="اكتبي اسم الطالبة"
                required
            >


            <label for="lateReason">
                سبب التأخير
            </label>

            <select id="lateReason">

                <option value="">
                    اختيار
                </option>

                <option value="المواصلات">
                    المواصلات
                </option>

                <option value="الازدحام">
                    الازدحام
                </option>

                <option value="ظرف عائلي">
                    ظرف عائلي
                </option>

                <option value="أسباب أخرى">
                    أسباب أخرى
                </option>

            </select>


            <label>
                وقت التسجيل
            </label>

            <input
                type="text"
                id="lateTime"
                readonly
            >


            <button
                type="submit"
                id="saveButton">

                💾 حفظ التأخير

            </button>

        </form>


        <p id="successMessage"></p>


        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'">

            ← العودة للوحة الرئيسية

        </button>

    </div>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* عناصر الصفحة */

const lateForm =
    document.getElementById("lateForm");

const timeInput =
    document.getElementById("lateTime");

const successMessage =
    document.getElementById("successMessage");

const saveButton =
    document.getElementById("saveButton");


/* تحديث الوقت */

function updateTime() {

    const now = new Date();

    timeInput.value =
        now.toLocaleTimeString("ar-JO");

}

updateTime();


/* تحديث الوقت كل ثانية */

setInterval(
    updateTime,
    1000
);


/* حفظ التأخير */

lateForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const studentName =
            document
                .getElementById("studentName")
                .value
                .trim();


        const className =
            document
                .getElementById("className")
                .value;


        const reason =
            document
                .getElementById("lateReason")
                .value;


        if (!studentName || !className) {

            alert(
                "اختاري الصف واكتبي اسم الطالبة"
            );

            return;
        }


        /* منع الضغط أكثر من مرة */

        saveButton.disabled = true;

        saveButton.textContent =
            "⏳ جاري الحفظ...";


        const now = new Date();


        try {

            await addDoc(
                collection(
                    db,
                    "lateRecords"
                ),
                {

                    studentName:
                        studentName,

                    className:
                        className,

                    reason:
                        reason,

                    date:
                        now.toLocaleDateString(
                            "ar-JO"
                        ),

                    time:
                        now.toLocaleTimeString(
                            "ar-JO"
                        ),

                    teacher:
                        localStorage.getItem(
                            "username"
                        ) || "المعلمة",

                    createdAt:
                        serverTimestamp()

                }
            );


            /* الحفظ نجح */

            successMessage.textContent =
                "✅ تم تسجيل التأخير بنجاح";

            successMessage.style.color =
                "green";


            /* الآن فقط نفرغ النموذج */

            lateForm.reset();

            updateTime();


        } catch (error) {

            console.error(
                "Firebase Error:",
                error
            );


            successMessage.textContent =
                "❌ لم يتم حفظ التأخير. تأكدي من اتصال الإنترنت وصلاحيات Firebase.";

            successMessage.style.color =
                "red";

        }


        /* إعادة زر الحفظ */

        saveButton.disabled = false;

        saveButton.textContent =
            "💾 حفظ التأخير";

    }
);

</script>

<footer class="site-footer">
    &copy; 2026 جميع الحقوق محفوظة | تصميم وتطوير: سالي موسى العمرات
</footer>
</body>

</html>
