<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>سجل التأخيرات</title>

    <link rel="stylesheet"
          href="records.css">

</head>


<body>


<div class="records-container">

    <div class="records-card">

        <h1>📋 سجل التأخيرات</h1>

        <p>
            جميع الطالبات المتأخرات
        </p>


        <input
            type="text"
            id="searchInput"
            placeholder="ابحثي باسم الطالبة"
        >


        <select id="classFilter">
<option value="">
                    اختاري الصف
                </option>

                <option value="سابع أ">سابع أ</option>
                <option value="سابع ب">سابع ب</option>
                <option value="سابع ج">سابع ج</option>

                <option value="ثامن أ">ثامن أ</option>
                <option value="ثامن ب">ثامن ب</option>
                <option value="ثامن ج">ثامن ج</option>

                <option value="تاسع أ">تاسع أ</option>
                <option value="تاسع ب">تاسع ب</option>
                <option value="تاسع ج">تاسع ج</option>

                <option value="عاشر أ">عاشر أ</option>
                <option value="عاشر ب">عاشر ب</option>

                <option value="أول ثانوي أ">أول ثانوي أ</option>
                <option value="أول ثانوي ب">أول ثانوي ب</option>

                <option value="توجيهي صحي">توجيهي صحي</option>
                <option value="توجيهي هندسي">توجيهي هندسي</option>
                <option value="توجيهي لغات">توجيهي لغات</option>
                <option value="توجيهي أعمال">توجيهي أعمال</option>

                <option value="عاشر IT">عاشر IT</option>
                <option value="أول ثانوي IT">أول ثانوي IT</option>
                <option value="توجيهي IT">توجيهي IT</option>

                <option value="عاشر أعمال">عاشر أعمال</option>
                <option value="أول ثانوي أعمال">أول ثانوي أعمال</option>

                <option value="توجيهي BTEC أعمال">
                    توجيهي BTEC أعمال
                </option>
            

            

        </select>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            الطالبة
                        </th>

                        <th>
                            الصف
                        </th>

                        <th>
                            التاريخ
                        </th>

                        <th>
                            الوقت
                        </th>

                        <th>
                            السبب
                        </th>

                        <th>
                            المعلمة
                        </th>

                    </tr>

                </thead>


                <tbody id="recordsTable"></tbody>

            </table>

        </div>


        <p id="noRecords">
            لا يوجد سجلات حاليًا.
        </p>


        <p id="loadingMessage">
            ⏳ جاري تحميل السجلات...
        </p>


        <button
            onclick="window.location.href='dashboard.html'">

            ← العودة

        </button>

    </div>

</div>



<script type="module">

import { db } from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const table =
    document.getElementById(
        "recordsTable"
    );


const noRecords =
    document.getElementById(
        "noRecords"
    );


const loadingMessage =
    document.getElementById(
        "loadingMessage"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const classFilter =
    document.getElementById(
        "classFilter"
    );


let records = [];



async function loadRecords() {

    try {


        loadingMessage.style.display =
            "block";


        const recordsQuery =
            query(

                collection(
                    db,
                    "lateRecords"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )

            );


        const snapshot =
            await getDocs(
                recordsQuery
            );


        records = [];


        snapshot.forEach(
            (doc) => {

                records.push({

                    id: doc.id,

                    ...doc.data()

                });

            }
        );


        loadingMessage.style.display =
            "none";


        displayRecords();


    }

    catch (error) {


        console.error(
            "Firebase Error:",
            error
        );


        loadingMessage.textContent =
            "❌ حدث خطأ أثناء تحميل السجلات";


        loadingMessage.style.color =
            "red";

    }

}



function displayRecords() {


    table.innerHTML = "";


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const selectedClass =
        classFilter.value;


    const filtered =
        records.filter(
            record => {


                const name =
                    String(
                        record.studentName || ""
                    ).toLowerCase();


                const className =
                    String(
                        record.className || ""
                    );


                return (

                    name.includes(
                        search
                    )

                    &&

                    (
                        selectedClass === ""

                        ||

                        className ===
                            selectedClass
                    )

                );

            }
        );


    if (
        filtered.length === 0
    ) {

        noRecords.style.display =
            "block";

        return;

    }


    noRecords.style.display =
        "none";


    filtered.forEach(
        (record, index) => {


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${record.studentName || "-"}
                </td>

                <td>
                    ${record.className || "-"}
                </td>

                <td>
                    ${record.date || "-"}
                </td>

                <td>
                    ${record.time || "-"}
                </td>

                <td>
                    ${record.reason || "-"}
                </td>

                <td>
                    ${record.teacher || "-"}
                </td>

            `;


            table.appendChild(row);

        }
    );

}



searchInput.addEventListener(
    "input",
    displayRecords
);


classFilter.addEventListener(
    "change",
    displayRecords
);



loadRecords();

</script>
<footer class="site-footer">
© جميع الحقوق محفوظة<br>
    تصميم وتطوير سالي موسى العمرات
</footer>

</body>

</html>
